name: SAIGA POC build and publish
on:
  workflow_dispatch:
  push:
    branches: [poc/cloudflare-leptos-static-publishing]
    paths: ['poc/**', '.github/workflows/saiga-poc-publish.yml']
permissions:
  contents: read
concurrency:
  group: saiga-poc-static-publication
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc
      - name: Fetch published snapshot (or use checked-in seed)
        env:
          PUBLISH_URL: ${{ vars.SAIGA_POC_PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.SAIGA_POC_PUBLISH_TOKEN }}
        run: |
          if [ -n "$PUBLISH_URL" ] && [ -n "$PUBLISH_TOKEN" ]; then
            curl --fail --show-error --silent --retry 3 -H "Authorization: Bearer $PUBLISH_TOKEN" "$PUBLISH_URL" -o content.json
          else
            echo "Using sample content; admin publishing not configured yet"
          fi
      - name: Compile admin Worker for wasm
        run: cargo check -p saiga-poc-admin --target wasm32-unknown-unknown
      - name: Build browser WASM
        run: |
          cargo build --release -p saiga-poc-browser --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked
          mkdir -p dist/pkg
          wasm-bindgen ../target/wasm32-unknown-unknown/release/saiga_poc_browser.wasm --target web --out-dir dist/pkg
      - name: Generate static HTML with Leptos
        run: cargo run --release -p saiga-poc-generator -- content.json dist
      - name: Check direct-route files and WASM
        run: |
          test -s dist/index.html
          test -s dist/articles/index.html
          test -s dist/destinations/index.html
          test -s dist/article/welcome/index.html
          test -s dist/pkg/saiga_poc_browser_bg.wasm
      - name: Deploy static assets to Cloudflare
        if: ${{ vars.SAIGA_POC_ENABLE_DEPLOY == 'true' }}
        run: npx --yes wrangler@latest deploy -c public.wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
